# OPC water, 500 molecules, 1.000 g/cm^3 (24.64 A box), 260 K, NVT.
# Standard Lennard-Jones OPC parameters and Ewald electrostatics, for the CBMC
# branch (no tabulated potentials, no PME). Starts from a configuration
# equilibrated at 260 K with 10 million single-molecule moves.
# Multiparticle moves only (rigid-body translation or rotation of all molecules).
Restart                   true
PRNG                      INTSEED
Random_Seed               7
ParaTypeCHARMM            true
Parameters                OPC_FF.inp
Coordinates 0             OPC_260K_BOX_0_restart.pdb
Structure 0               OPC_260K_BOX_0_restart.psf
binCoordinates 0          OPC_260K_BOX_0_restart.coor
extendedSystem 0          OPC_260K_BOX_0_restart.xsc

Temperature               260.0
Potential                 VDW
LRC                       true
Rcut                      8.0
RcutLow                   1.0
RcutCoulomb 0             12.0
Exclude                   1-4
Ewald                     true
ElectroStatic             true
CachedFourier             false
Tolerance                 1e-05
1-4scaling                0.0
PressureCalc              true 10000

RunSteps                  10000
EqSteps                   1000
AdjSteps                  10
DisFreq                   0.0
RotFreq                   0.0
MultiParticleFreq         1.0

CBMC_First                12
CBMC_Nth                  10
CBMC_Ang                  4
CBMC_Dih                  10

OutputName                OPC_260K_mp
RestartFreq               true 10000
CheckpointFreq            false 10000
CoordinatesFreq           false 10000
DCDFreq                   true 200
ConsoleFreq               true 1000
BlockAverageFreq          true 10000
OutEnergy                 true true
OutPressure               true true
OutMolNum                 true true
OutDensity                true true
